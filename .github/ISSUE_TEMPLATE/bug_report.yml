name: Bug report / 问题反馈
description: Report a reproducible NoveMD software problem / 反馈可复现的 NoveMD 软件问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve NoveMD. Do not post licence codes, order details, private documents, personal data or security vulnerabilities here.

        感谢你的反馈。请勿在此发布激活码、订单资料、私人文档、个人信息或安全漏洞。
  - type: input
    id: novemd-version
    attributes:
      label: NoveMD version / NoveMD 版本
      placeholder: 2.0.11
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version / Windows 版本
      placeholder: Windows 11 64-bit
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Use a minimal example that contains no private information. / 请使用不含私人信息的最小示例。
      placeholder: "1. Open…\n2. Choose…\n3. Observe…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result / 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result / 实际结果
    validations:
      required: true
  - type: input
    id: format
    attributes:
      label: File format and reader, if relevant / 相关文件格式与阅读软件
      placeholder: DOCX opened in Microsoft Word 2021
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation / 隐私确认
      options:
        - label: I removed licence codes, order details, private documents, personal data and credentials. / 我已移除激活码、订单资料、私人文档、个人信息和凭据。
          required: true
        - label: This report does not disclose a security vulnerability. / 本报告不公开披露安全漏洞。
          required: true

